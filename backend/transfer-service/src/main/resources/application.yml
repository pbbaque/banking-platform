spring:
  application:
    name: transfer-service

  datasource:
    url: ${TRANSFER_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${TRANSFER_DB_USERNAME:BANK_TRANSFER}
    password: ${TRANSFER_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

clients:
  account-service:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}