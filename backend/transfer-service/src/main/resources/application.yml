spring:
  application:
    name: transfer-service

  datasource:
    url: ${TRANSFER_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${TRANSFER_DB_USERNAME:BANK_TRANSFER}
    password: ${TRANSFER_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

clients:
  account-service:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
    internal-token: ${INTERNAL_SERVICE_TOKEN}

messaging:
  kafka:
    topics:
      audit-events:
        name: ${AUDIT_EVENTS_TOPIC:banking.audit-events}
        partitions: 3
        replication-factor: 1

    outbox:
      batch-size: 100
      send-timeout: 10s
      retry-delay: 30s
      polling-interval: 5s

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}