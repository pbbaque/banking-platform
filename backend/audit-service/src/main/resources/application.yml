spring:
  application:
    name: audit-service

  datasource:
    url: ${AUDIT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${AUDIT_DB_USERNAME:BANK_AUDIT}
    password: ${AUDIT_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${AUDIT_KAFKA_GROUP_ID:audit-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info

messaging:
  kafka:
    topics:
      audit-events:
        name: ${AUDIT_EVENTS_TOPIC:banking.audit-events}

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
