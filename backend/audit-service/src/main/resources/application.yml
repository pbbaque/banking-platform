spring:
  application:
    name: audit-service

  datasource:
    url: ${AUDIT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${AUDIT_DB_USERNAME:BANK_AUDIT}
    password: ${AUDIT_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info