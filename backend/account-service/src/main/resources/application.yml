spring:
  application:
    name: account-service

  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ACCOUNT_DB_USERNAME:BANK_ACCOUNT}
    password: ${ACCOUNT_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

customer-service:
  base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}

  internal:
    token: ${INTERNAL_SERVICE_TOKEN}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info