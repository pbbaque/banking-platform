spring:
  application:
    name: account-service

  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ACCOUNT_DB_USERNAME:BANK_ACCOUNT}
    password: ${ACCOUNT_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info