spring:
  application:
    name: identity-service

  datasource:
    url: ${IDENTITY_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${IDENTITY_DB_USERNAME:BANK_IDENTITY}
    password: ${IDENTITY_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info