<div class="shell">
  <header class="mobile-header">
    <a routerLink="/dashboard" class="mobile-brand" aria-label="Ir al inicio">
      <span class="brand-symbol">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4.75h6.25a4.25 4.25 0 0 1 0 8.5H7V4.75Zm0 8.5h7a4 4 0 0 1 0 8H7v-8.5Z" />
        </svg>
      </span>

      <span class="mobile-brand-copy">
        <strong>Banking</strong>
        <small>Platform</small>
      </span>
    </a>

    <button
      type="button"
      class="mobile-profile-button"
      aria-label="Cerrar sesión"
      (click)="logout()"
    >
      PB
    </button>
  </header>

  <aside class="sidebar">
    <div class="sidebar-main">
      <a routerLink="/dashboard" class="brand">
        <span class="brand-symbol">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 4.75h6.25a4.25 4.25 0 0 1 0 8.5H7V4.75Zm0 8.5h7a4 4 0 0 1 0 8H7v-8.5Z" />
          </svg>
        </span>

        <span class="brand-copy">
          <strong>Banking</strong>
          <small>Personal finance</small>
        </span>
      </a>

      <nav aria-label="Navegación principal">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10.5 12 4l8 6.5V20H5V10.5Z" />
              <path d="M9.5 20v-6h5v6" />
            </svg>
          </span>

          <span>Inicio</span>
        </a>

        <a routerLink="/accounts" routerLinkActive="active">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="6" width="17" height="12" rx="2.5" />
              <path d="M3.5 10h17" />
              <circle cx="16.5" cy="14" r="1" />
            </svg>
          </span>

          <span>Cuentas</span>
        </a>

        <a routerLink="/transfers" routerLinkActive="active">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8h13" />
              <path d="m15 5 3 3-3 3" />
              <path d="M19 16H6" />
              <path d="m9 13-3 3 3 3" />
            </svg>
          </span>

          <span>Transferencias</span>
        </a>

        <a routerLink="/profile" routerLinkActive="active">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M5.5 20c.6-4 2.8-6 6.5-6s5.9 2 6.5 6" />
            </svg>
          </span>

          <span>Perfil</span>
        </a>

        <a routerLink="/audit" routerLinkActive="active" class="audit-link">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="3.5" width="14" height="17" rx="2" />
              <path d="M8.5 8h7" />
              <path d="M8.5 12h7" />
              <path d="M8.5 16h4.5" />
            </svg>
          </span>

          <span>Auditoría</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">PB</div>

        <div class="user-copy">
          <strong>Tu cuenta</strong>
          <small>Sesión iniciada</small>
        </div>
      </div>

      <button type="button" class="logout" (click)="logout()">
        <span class="logout-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 5H6.5A2.5 2.5 0 0 0 4 7.5v9A2.5 2.5 0 0 0 6.5 19H10" />
            <path d="M14 8l4 4-4 4" />
            <path d="M9 12h9" />
          </svg>
        </span>

        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <div class="content-inner">
      <router-outlet />
    </div>
  </main>
</div>
