server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /identity-api/ {
        proxy_pass http://identity-service:8082/;
    }

    location /customer-api/ {
        proxy_pass http://customer-service:8081/;
    }

    location /account-api/ {
        proxy_pass http://account-service:8083/;
    }

    location /transfer-api/ {
        proxy_pass http://transfer-service:8084/;
    }

    location /audit-api/ {
        proxy_pass http://audit-service:8085/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}